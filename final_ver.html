<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f2ed" />
    <title>Рельсовый контроль · ЕВРАЗ</title>
    <style>
:root {
  --bg: #f4f2ed;
  --surface: #fffefa;
  --ink: #242925;
  --muted: #636a63;
  --line: #d9dcd3;
  --orange: #c6461e;
  --orangeLight: #fff0e8;
  --green: #38664b;
  --dark: #202924;
  --mono: Consolas, "Courier New", monospace;
  --sans: Arial, Helvetica, sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
  min-height: 44px;
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button,
input {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #347fa8;
  outline-offset: 4px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
.app {
  max-width: 1800px;
  margin: auto;
  padding: 0 32px 16px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  height: 88px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 32px;
  min-width: 0;
}
.brand picture {
  display: flex;
  flex-shrink: 0;
}
.brand-logo {
  width: 168px;
  height: auto;
  display: block;
}
.brand h1 {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.7px;
  line-height: 1.15;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.quiet,
.iconbtn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 10px 12px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 14px;
}
.quiet:hover,
.iconbtn:hover {
  background: #e8e9e0;
  color: var(--ink);
}
.quiet svg,
.iconbtn svg {
  width: 20px;
  height: 20px;
}
.iconbtn {
  padding: 10px;
  min-width: 44px;
}
.metrics {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 18px 0 20px;
}
.metric {
  display: flex;
  align-items: center;
  gap: 16px;
}
.metric-label {
  font-size: 14px;
  color: var(--muted);
}
.metric-value {
  font: 27px/1.2 var(--mono);
  letter-spacing: -1px;
}
.metric-value small {
  font-size: 16px;
  color: var(--muted);
  letter-spacing: -0.5px;
}
.metric-level {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
}
.machine {
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  background: var(--dark);
  border: 1px solid #354233;
}
.canvas-wrap {
  height: clamp(340px, calc(100dvh - 388px), 780px);
  position: relative;
}
.machine-status {
  position: absolute;
  top: 22px;
  left: 24px;
  z-index: 1;
  color: #c8d5c0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  pointer-events: none;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #a4c995;
  box-shadow: 0 0 8px #a4c99544;
}
#lineCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}
.line-progress {
  position: absolute;
  height: 2px;
  bottom: 0;
  left: 0;
  right: 0;
  background: #899d7622;
}
.line-progress span {
  height: 100%;
  width: 0;
  background: #e48d51;
  display: block;
}
.pause-overlay {
  position: absolute;
  inset: 0;
  background: #17211be0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  z-index: 2;
}
.pause-overlay.show {
  display: flex;
}
.pause-overlay h2 {
  font-size: 30px;
  color: #f4f6ee;
  letter-spacing: -1px;
}
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 18px 0 16px;
}
.btn {
  border: 1px solid var(--line);
  padding: 12px 20px;
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn:hover {
  background: #eaece3;
}
.btn.primary {
  background: var(--orange);
  border-color: var(--orange);
  color: white;
}
.btn.primary:hover {
  background: #b63c17;
}
.btn.dark {
  background: var(--dark);
  border-color: var(--dark);
  color: #fff;
}
.btn.dark:hover {
  background: #354239;
}
.btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.controls .btn {
  min-width: 180px;
}
.controls .btn.primary {
  min-width: 210px;
}
.shortcut {
  font: 11px var(--mono);
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0 4px;
  opacity: 0.55;
  margin-left: 4px;
}
.pause-count {
  font: 12px var(--mono);
  color: var(--muted);
  margin-left: 4px;
}
.history-dock {
  border-top: 1px solid var(--line);
  padding-top: 4px;
}
.history-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.history-heading h2 {
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}
.history-heading h2 span {
  font: 12px var(--mono);
  color: var(--muted);
  margin-left: 4px;
}
.text-button {
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 13px;
  padding: 8px 0 8px 18px;
}
.text-button:hover {
  color: var(--orange);
}
.history {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  min-height: 76px;
  padding: 2px 2px 8px;
  scrollbar-width: thin;
  scrollbar-color: #bbc2b6 transparent;
}
.rail-card {
  background: #eef0e8;
  border: 1px solid #d9dfd1;
  border-radius: 6px;
  padding: 8px 10px;
  width: 126px;
  flex: 0 0 126px;
  text-align: left;
  color: var(--ink);
  position: relative;
}
.rail-card:hover {
  border-color: #7a8c75;
  background: #e9ede1;
}
.rail-card.selected {
  border-color: var(--orange);
  box-shadow: 0 0 0 1px var(--orange);
}
.rail-card.checked {
  border-color: #37624c;
  background: #e9f0e3;
}
.rail-card canvas {
  width: 100%;
  height: 30px;
  display: block;
  margin-top: 5px;
}
.card-number {
  font: 12px var(--mono);
  display: flex;
  justify-content: space-between;
  gap: 5px;
}
.empty {
  color: var(--muted);
  font-size: 14px;
  margin: auto;
  text-align: center;
}
.footnote {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 10px;
}
.eyebrow {
  font: 12px/1.4 var(--mono);
  letter-spacing: 1.7px;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow:empty {
  display: none;
}
.orange-text {
  color: var(--orange);
}
.log-row {
  display: flex;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.log-time {
  font: 12px/1.9 var(--mono);
  color: var(--muted);
  flex-shrink: 0;
}
.log-row.good .log-text {
  color: #2e6845;
}
.log-row.bad .log-text {
  color: #a83f25;
}
.journal-entries {
  max-height: 55vh;
  overflow: auto;
}

.dialog-backdrop {
  position: fixed;
  inset: 0;
  background: #101b15b8;
  backdrop-filter: blur(7px);
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
}
.dialog-backdrop.open {
  display: flex;
}
.dialog {
  background: var(--bg);
  border: 1px solid #d8ded0;
  border-radius: 14px;
  width: min(860px, 100%);
  max-height: calc(100dvh - 48px);
  overflow: auto;
  box-shadow: 0 28px 90px #0005;
}
.dialog.wide {
  width: min(1040px, 100%);
}
.dialog-header {
  padding: 23px 28px 20px;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
  border-bottom: 1px solid var(--line);
}
.dialog-header h2 {
  font-size: 24px;
  letter-spacing: -0.8px;
  line-height: 1.25;
}
.dialog-header .eyebrow {
  margin-bottom: 6px;
}
.dialog-body {
  padding: 24px 28px 28px;
}
.dialog-close {
  min-width: 44px;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 23px;
  font-weight: 400;
  color: var(--ink);
}
.dialog-close:hover {
  background: #e3e7db;
}
.welcome-layout {
  display: grid;
  grid-template-columns: 1fr 0.9fr;
  gap: 30px;
}
.welcome-title {
  font-size: 42px;
  letter-spacing: -1.7px;
  line-height: 1.09;
  margin: 12px 0 18px;
  max-width: 420px;
}
.welcome-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 410px;
}
.orange-text {
  color: var(--orange);
}
.welcome-art {
  background: var(--dark);
  border-radius: 9px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  min-height: 235px;
  color: #e8eee2;
}
.art-label {
  font: 11px var(--mono);
  letter-spacing: 1.5px;
  color: #b2c0ad;
}
.art-track {
  margin: 20px 0 40px;
  transform: rotate(-10deg);
  display: grid;
  gap: 17px;
}
.art-rail {
  height: 40px;
  background: repeating-linear-gradient(0deg, #8b988c 0px, #c8cfc1 2px, #9eaa9a 3px, #b7c0ae 5px);
  box-shadow:
    0 7px 0 #465544,
    0 9px 0 #111c16;
  border-radius: 1px;
  position: relative;
}
.art-rail:after {
  content: "";
  position: absolute;
  width: 50px;
  height: 5px;
  background: #394538;
  top: 14px;
  left: 57%;
  border-radius: 50%;
  transform: rotate(-15deg);
  box-shadow: 0 1px 0 #dae0cf;
}
.art-ring {
  position: absolute;
  left: 54%;
  top: 47px;
  width: 78px;
  height: 160px;
  border: 2px solid #eab27b;
  border-radius: 40px;
  transform: rotate(-10deg);
}
.art-foot {
  font: 11px/1.7 var(--mono);
  color: #c1cdb8;
  margin-top: 18px;
}
.intro-steps {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}
.intro-step {
  flex: 1;
  font-size: 12px;
  color: var(--muted);
}
.intro-step strong {
  display: block;
  color: var(--ink);
  font: 12px var(--mono);
  margin-bottom: 4px;
}
.level-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 26px;
}
.level-choice {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 13px 12px;
  text-align: left;
  min-width: 0;
  color: var(--ink);
}
.level-choice.active {
  border-color: var(--orange);
  background: var(--orangeLight);
  box-shadow: 0 0 0 1px var(--orange);
}
.level-choice .eyebrow {
  font-size: 10px;
  letter-spacing: 0.8px;
}
.level-choice b {
  display: block;
  font-size: 14px;
  margin: 6px 0 3px;
}
.level-choice small {
  font-size: 12px;
  color: var(--muted);
}
.dialog-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
}
.dialog-actions .btn {
  min-width: 150px;
}
.start-hint {
  font-size: 12px;
  color: var(--muted);
  max-width: 270px;
}
.help-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
.help-block h3 {
  font-size: 17px;
  margin-bottom: 9px;
}
.help-block p,
.help-block li {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
}
.help-block ul {
  padding-left: 18px;
  margin: 8px 0;
}
.notice {
  padding: 12px 15px;
  border: 1px solid #d8dfcf;
  background: #eaf0e3;
  color: #3b5338;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.6;
  margin: 16px 0;
}
.notice.warning {
  background: #fff0e5;
  border-color: #e9c7ae;
  color: #8e3c1d;
}
.inspect-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}
.inspect-area {
  height: 255px;
  background: #202924;
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.inspect-area canvas {
  height: 100%;
  width: 100%;
  cursor: crosshair;
  display: block;
}
.inspect-legend {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
}
.legend-ring {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 2px solid var(--orange);
  border-radius: 50%;
  vertical-align: -2px;
  margin-right: 6px;
}
.inspect-nav {
  display: flex;
  gap: 8px;
}
.alarm-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  max-height: 294px;
  overflow: auto;
  padding: 2px;
}
.alarm-grid .rail-card {
  width: auto;
}
.alarm-toolbar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  margin-bottom: 14px;
}
.alarm-toolbar b {
  color: var(--orange);
}
.reasons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}
.reason {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  display: flex;
  gap: 10px;
  align-items: start;
  cursor: pointer;
  font-size: 14px;
}
.reason:has(input:checked) {
  border-color: var(--orange);
  background: var(--orangeLight);
}
.reason input {
  accent-color: var(--orange);
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  margin: 3px 0 0;
}
.reason small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}
.feedback {
  margin-top: 16px;
  font-size: 14px;
  font-weight: 600;
  min-height: 21px;
}
.result-hero {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  padding-bottom: 25px;
  border-bottom: 1px solid var(--line);
}
.result-score {
  font: 64px/1 var(--mono);
  letter-spacing: -5px;
}
.result-score-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}
.result-grade {
  text-align: right;
}
.result-grade h3 {
  font-size: 25px;
  letter-spacing: -0.6px;
}
.result-grade p {
  font-size: 14px;
  color: var(--muted);
  max-width: 320px;
  margin-top: 8px;
}
.result-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 22px 0;
}
.result-stat {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 15px;
}
.result-stat b {
  display: block;
  font: 25px var(--mono);
}
.result-stat span {
  font-size: 12px;
  color: var(--muted);
}
.records {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-top: 18px;
}
.records h3 {
  font-size: 15px;
  margin-bottom: 10px;
}
.record-row {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
}
.record-row b {
  font-family: var(--mono);
  margin-left: auto;
}
.name-form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.name-form input {
  min-width: 0;
  flex: 1;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid #adb9a5;
  background: var(--surface);
  border-radius: 6px;
  color: var(--ink);
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 18px);
  opacity: 0;
  pointer-events: none;
  z-index: 40;
  background: #24362a;
  color: white;
  box-shadow: 0 8px 24px #0003;
  border: 1px solid #71826d;
  border-radius: 9px;
  padding: 14px 20px;
  font-size: 14px;
  width: max-content;
  max-width: min(520px, calc(100% - 32px));
  transition:
    opacity 0.2s,
    transform 0.2s;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast.bad {
  background: #653321;
  border-color: #b96e53;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191f1b;
    --surface: #242c26;
    --ink: #f0f2ea;
    --muted: #b3beae;
    --line: #475245;
    --orange: #f0875a;
    --orangeLight: #3e2d22;
    --green: #a2c69b;
  }
  .btn.primary {
    color: #19241b;
  }
  .btn.primary:hover {
    background: #e9a079;
    color: #19241b;
  }
  .quiet:hover,
  .iconbtn:hover,
  .btn:hover {
    background: #364132;
  }
  .rail-card {
    background: #2d3729;
    border-color: #4f5d45;
    color: #f0f2ea;
  }
  .rail-card:hover {
    background: #3b4735;
  }
  .rail-card.checked {
    background: #354b30;
    border-color: #a4c790;
  }
  .notice {
    background: #2b3b26;
    border-color: #526749;
    color: #d2e4c7;
  }
  .notice.warning {
    background: #422f23;
    border-color: #845c41;
    color: #ffd5b8;
  }
  .dialog-close:hover {
    background: #3a4733;
  }
  .log-row.good .log-text {
    color: #a6d49d;
  }
  .log-row.bad .log-text {
    color: #f3a080;
  }
  .inspect-legend {
    color: var(--muted);
  }
}
@media (max-width: 1100px) {
  .app {
    padding: 0 24px 14px;
  }
  .topbar {
    height: 76px;
  }
  .brand {
    gap: 24px;
  }
  .brand-logo {
    width: 154px;
  }
  .brand h1 {
    font-size: 20px;
  }
  .metrics {
    gap: 18px;
  }
  .metric {
    gap: 10px;
  }
  .metric-value {
    font-size: 25px;
  }
  .metric-level {
    font-size: 15px;
  }
  .canvas-wrap {
    height: clamp(340px, calc(100dvh - 368px), 720px);
  }
}
@media (max-width: 760px) {
  .app {
    padding: 0 20px 12px;
  }
  .brand {
    gap: 20px;
  }
  .brand-logo {
    width: 142px;

        class="dialog"

        tabindex="-1"

          <div>
            <div class="eyebrow" id="dialogKicker"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id),
    $$ = (s) => Array.from(document.querySelectorAll(s));
  const icons = {
    inspect: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M10 7v6M7 10h6"/>',
    alarm: '<path d="M12 3 2 21h20L12 3ZM12 9v5M12 17v.5"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    play: '<path d="m8 4 12 8-12 8V4Z"/>',
  };
  const svg = (name) =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
  const levels = {
    1: {
      name: "Обучение",
      title: "Увидеть закономерность",
      desc: "Один заметный след повторяется на нескольких рельсах. Не спутайте его со случайной царапиной.",
      total: 10,
      interval: 5,
      contrast: 0.92,
      noise: 0.14,
      series: 1,
    },
    2: {
      name: "Практика",
      title: "Два разных ритма",
      desc: "Две серии с разной периодичностью. Случайных следов больше — сравнивайте форму и координаты.",
      total: 20,
      interval: 3.6,
      contrast: 0.68,
      noise: 0.52,
      series: 2,
    },
    3: {
      name: "Эксперт",
      title: "Смотреть внимательнее",
      desc: "Слабые следы, пропуски в сериях и больше помех. Отсутствие следа на одном рельсе не исключает закономерность.",
      total: 30,
      interval: 2.5,
      contrast: 0.42,
      noise: 0.78,
      series: 3,
    },
    4: {
      name: "Бесконечный",
      title: "Держать линию",
      desc: "Поток не заканчивается. Скорость и сложность растут каждые 20 рельсов. Набирайте очки в непрерывном потоке.",
      total: Infinity,
      interval: 3.8,
      contrast: 0.65,
      noise: 0.6,
      series: "∞",
    },
  };
  let chosenLevel = 1,
    state = null,
    modalType = "",
    selectedId = null,
    inspectId = null,
    alarmIds = new Set(),
    alarmSnapshot = [],
    toastTimer,
    priorFocus = null,
    helpReturn = null;
  const canvas = $("lineCanvas"),
    ctx = canvas.getContext("2d");
  let cw = 900,
    ch = 292,
    dpr = 1,
    lastFrame = 0,
    ambient = 0,
    renderTimer = 0;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) {
    return () => {
      seed |= 0;

    return Math.round(n).toLocaleString("ru-RU");
  }
  function clock(t) {
    return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  }
  function esc(t) {
    return String(t).replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  }
  function beep() {}
  function toast(text, bad = false) {
    $("toast").textContent = text;
    $("toast").className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4800);
  }
  function log(text, type = "info") {
    if (!state) return;
    state.logs.unshift({ time: clock(state.elapsed), text, type });
    state.logs = state.logs.slice(0, 80);
    if (modalType === "journal") renderJournal();
  }
  function renderJournal() {
    if (!$("journalEntries")) return;
    $("journalEntries").innerHTML = state?.logs.length
      ? state.logs
          .map(
            (l) =>
              `<div class="log-row ${l.type}"><span class="log-time">${l.time}</span><span class="log-text">${esc(l.text)}</span></div>`,

  }
  function showJournal() {
    openModal(
      "journal",
      "",
      "Журнал событий",
      '<div id="journalEntries" class="journal-entries" aria-live="polite"></div>',
    );
    renderJournal();
  }
  function setupButtons() {
    $("inspectBtn").innerHTML = 'Осмотреть';
    $("alarmBtn").innerHTML = 'Тревога';
    updateUI();
  }
  function openModal(type, kicker, title, body, wide = false, closable = true) {
    priorFocus = document.activeElement;
    modalType = type;
    $("dialog").dataset.kind = type;
    $("dialogKicker").textContent = kicker;
    $("dialogTitle").textContent = title;
    $("dialogBody").innerHTML = body;
    $("dialog").classList.toggle("wide", wide);

      const target = closable ? $("closeModal") : $("dialog");
      target?.focus({ preventScroll: true });
      $("dialog").scrollTop = 0;
    });
  }
  function closeModal() {
    if (["welcome", "result"].includes(modalType)) return;
    forceClose();
  }
  function forceClose() {
    modalType = "";
    $("modal").classList.remove("open");
    document.body.style.overflow = "";
    if (priorFocus && document.contains(priorFocus)) priorFocus.focus();
  }
  function welcome() {
    chosenLevel = chosenLevel || 1;
    openModal(
      "welcome",
      "СИМУЛЯТОР ОПЕРАТОРА ПОСТА КОНТРОЛЯ",
      "Ваше внимание — качество рельса",
      `<div class="welcome-layout"><div><div class="welcome-title"></div><p class="welcome-text">Вы — оператор поста контроля. Находите повторяющиеся дефекты на рельсах и распознавайте повреждение прокатного валка до того, как брак станет массовым.</p><div class="intro-steps"><div class="intro-step"><strong></strong></div><div class="intro-step"><strong></strong></div><div class="intro-step"><strong></strong></div></div></div><div class="welcome-art" aria-label="Схема одинакового следа на трёх рельсах"><div class="art-label">ПРИЗНАК ПОВРЕЖДЕНИЯ ВАЛКА</div><div class="art-track"><div class="art-rail"></div><div class="art-rail"></div><div class="art-rail"></div></div><div class="art-ring"></div><div class="art-foot"></div></div></div><div class="level-picker" role="group" aria-label="Выберите уровень">${Object.entries(
        levels,
      )
        .map(
          ([k, l]) =>
            `<button class="level-choice ${+k === chosenLevel ? "active" : ""}" data-level="${k}" aria-pressed="${+k === chosenLevel}"><span class="eyebrow">УРОВЕНЬ ${k === "4" ? "∞" : k}</span><b>${l.name}</b><small>${l.total === Infinity ? "Свободная смена" : l.total + " рельсов"}</small></button>`,
        )
        .join(
          "",
        )}</div><div class="dialog-actions"><span class="start-hint"></span><button class="btn" id="welcomeHelp">Правила игры</button><button class="btn primary" id="startBtn">Начать смену →</button></div>`,
      true,
      false,
    );
    $$(".level-choice").forEach(
      (b) =>
        (b.onclick = () => {
          chosenLevel = +b.dataset.level;
          $$(".level-choice").forEach((c) => {
            c.classList.toggle("active", c === b);
            c.setAttribute("aria-pressed", c === b);
          });
        }),
    );
    $("startBtn").onclick = () => startLevel(chosenLevel);
    $("welcomeHelp").onclick = () => showHelp("welcome");
  }
  function showHelp(from = null) {
    helpReturn = from;
    const wasRunning = state?.running && !state.paused;
    if (wasRunning) {
      if (state.pauses < 3) {
        state.pauses++;
        state.paused = true;
        log("Линия остановлена для чтения правил. Пауза " + state.pauses + " из 3.");
        updateUI();
      } else {
        toast("Лимит пауз исчерпан. Правила открыты, но линия продолжает движение.", true);
      }
    }
    openModal(
      "help",
      "ПАМЯТКА ОПЕРАТОРА",
      "Как читать поверхность",
      `<div class="help-grid concise-help">
<div class="help-block"><h3>01. Найдите след</h3><p>Нажмите на рельс или карточку. В осмотре клик по дефекту ставит или снимает вашу заметку.</p></div>
<div class="help-block"><h3>02. Сопоставьте рельсы</h3><p>Если один след повторяется в одном месте на 2–5 рельсах, то это признак повреждения валка. В сложных сериях бывают пропуски.</p></div>
<div class="help-block"><h3>03. Проверьте гипотезу</h3><p>Нажмите 'Тревога', затем выберите от 2 до 5 рельс и укажите причину. Каждая серия засчитывается один раз.</p><p class="help-detail">Вся серия +100, часть +60, бонус за скорость до +50.<br>Ложная тревога −50, пропуск серии −150.</p></div>
<div class="help-block"><h3>04. Не спешите с выводом</h3><p>Похожие следы вне серии → «Другая причина»: +30. За чистые рельсы и разные пятна бонуса нет.</p><p class="help-detail">Пробел — пауза, до 3 раз. I — осмотр, A — тревога, Esc — закрыть.<br>Осмотр и тревога <b>не останавливают линию</b>.</p></div>
</div>`,
      true,
    );
  }

  // Все дефекты и их геометрия фиксируются при генерации. Осмотр не меняет поверхность.
  function makeShape(seed, x, y, type, contrast, group = null, kind = "noise") {
    const rand = rng(seed);
    return {
      seed,
      x,
      y,
      type,
      contrast,
      group,
      kind,
      angle: (rand() - 0.5) * 0.9,
      size: 0.82 + rand() * 0.36,
    };
  }
  function generateSchedule(l, total = 30, offset = 0) {
    const r = state.rand,
      episodes = [];
    let defs = [];
    if (l === 1) defs = [[3, 4, 5]];
    if (l === 2)
      defs = [
        [3, 4, 5, 6],
        [12, 14, 16],
      ];
    if (l === 3)
      defs = [
        [3, 4, 6, 7],
        [12, 14, 16, 18],
        [23, 24, 26, 27, 28],
      ];
    if (l === 4) {
      for (let i = 0; i < 3; i++) {
        const base = offset + 3 + i * 10;
        const gap = r() > 0.45 ? 2 : 1;
        const n = r() > 0.6 ? 4 : 3;
        defs.push(Array.from({ length: n }, (_, j) => base + j * gap));
      }
    }
    for (const members of defs) {
      const id = "p" + ++state.epCounter,
        type = l === 1 ? "scratch" : ["scratch", "dent", "stain"][Math.floor(r() * 3)];
      const shapeSeed = Math.floor(r() * 1e8);
      const x = 0.24 + r() * 0.52,
        y = 0.28 + r() * 0.44;
      const ep = {
        id,
        members,
        first: members[0],
        last: members.at(-1),
        resolved: false,
        missed: false,
        type,
        shapeSeed,
        x,
        y,
      };
      state.episodes.push(ep);
      episodes.push(ep);
    }
    // Учебная несистематическая пара: одинаковая форма, но далеко друг от друга.
    const otherPositions =
      l === 1 ? [7, 9] : l === 2 ? [9, 19] : l === 3 ? [10, 21] : [offset + 1, offset + 20];
    const otherId = "o" + ++state.otherCounter;
    state.otherGroups.push({ id: otherId, members: otherPositions, resolved: false });
    let prevNoise = [];
    for (let i = offset + 1; i <= offset + total; i++) {
      let defects = [];
      for (const ep of episodes) {
        if (ep.members.includes(i)) {
          const con = l === 4 ? Math.max(0.25, 0.7 - i * 0.002) : levels[l].contrast;
          defects.push(
            makeShape(
              ep.shapeSeed,
              ep.x + (r() - 0.5) * 0.016,
              ep.y + (r() - 0.5) * 0.018,
              ep.type,
              con,
              ep.id,
              "system",
            ),
          );
        }
      }
      let noisePositions = [];
      if (otherPositions.includes(i))
        defects.push(makeShape(9184, 0.29, 0.62, "dent", l === 1 ? 0.8 : 0.58, otherId, "other"));
      const probability = l === 4 ? Math.min(0.9, 0.55 + i * 0.003) : levels[l].noise;
      if (r() < probability && defects.length < 2) {
        let x,
          y,
          attempt = 0;
        do {
          x = 0.12 + r() * 0.76;
          y = 0.23 + r() * 0.53;
          attempt++;
        } while (
          attempt < 25 &&
          prevNoise.some((p) => Math.abs(p.x - x) < 0.17 && Math.abs(p.y - y) < 0.24)
        );
        const type = ["scratch", "stain", "dent"][Math.floor(r() * 3)];
        defects.push(makeShape(Math.floor(r() * 1e8), x, y, type, 0.35 + r() * 0.5));
        noisePositions.push({ x, y });
      }
      prevNoise = noisePositions;
      state.schedule.set(i, {
        id: i,
        seed: Math.floor(r() * 1e9),
        defects,
        marked: [],
        inspected: false,
        checked: false,
        enteredAt: 0,
        passed: false,
      });
    }
  }
  function startLevel(l) {
    forceClose();
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    state = {
      level: l,
      running: true,
      paused: false,
      pauses: 0,
      elapsed: 0,
      score: 0,
      spawned: 0,
      passed: 0,
      nextSpawn: 0,
      total: levels[l].total,
      rails: [],
      schedule: new Map(),
      episodes: [],
      otherGroups: [],
      epCounter: 0,
      otherCounter: 0,
      rand: rng(seed),
      logs: [],
      success: 0,
      falseAlarms: 0,
      misses: 0,
      otherSuccess: 0,
      losses: 0,
      reactions: [],
      reactionSeconds: [],
      saved: false,
      seed,
    };
    selectedId = null;
    inspectId = null;
    generateSchedule(l, l === 4 ? 30 : state.total);
    $("history").innerHTML = "";
    updateUI();
    log("Смена началась. Уровень " + l + " — " + levels[l].name + ".");
    spawn();
    if (l === 1) log("Обучение: ищите одинаковую форму в одном месте на соседних рельсах.");
    beep();
    lastFrame = performance.now();
  }
  function interval() {
    if (!state) return 5;
    return state.level === 4
      ? Math.max(2, 3.8 - Math.floor(state.spawned / 20) * 0.35)
      : levels[state.level].interval;
  }
  function transitTime() {
    return Math.max(7.8, interval() * 2.2);
  }
  function spawn() {
    if (!state || state.spawned >= state.total) return;
    if (!state.schedule.has(state.spawned + 1)) generateSchedule(4, 30, state.spawned);
    const rail = state.schedule.get(++state.spawned);
    rail.enteredAt = state.elapsed;
    rail.transit = transitTime();
    state.rails.push(rail);
    state.nextSpawn = state.elapsed + interval();
    selectedId = rail.id;
    if (state.level === 1 && rail.id === 4) {
      toast("Сравните рельсы №003 и №004: совпадают ли форма и место следа?");
      log("Подсказка: сравните №003 и №004 в истории.");
    }
    if (state.level === 4 && state.spawned % 20 === 1 && state.spawned > 1)
      log("Темп вырос: новый рельс каждые " + interval().toFixed(1) + " с.");
    renderHistory();
    updateUI();
  }
  function updateUI() {
    const l = levels[state?.level || 1],

    $("progressBar").style.width = state

    $("alarmBtn").disabled = !running || state?.rails.length < 2;
    $("endBtn").disabled = !running;
    $("pauseBtn").disabled = !running || (!state.paused && state.pauses >= 3);
    $("pauseBtn").innerHTML =
      (state?.paused ? "Продолжить" : "Пауза") +
      '<span class="pause-count">' +
      (3 - (state?.pauses || 0)) +
      "</span>";
    $("pauseBtn").setAttribute(
      "aria-label",
      (state?.paused ? "Продолжить" : "Пауза") +
        ". Осталось остановок: " +
        (3 - (state?.pauses || 0)),
    );
    $("pauseOverlay").classList.toggle("show", !!running && state.paused);
    $("machineStatus").innerHTML =
      '<span class="dot"></span>' +
      (running
        ? state.paused
          ? "Пауза"
          : "В работе"
        : state
          ? "Смена завершена"
          : "Готов к запуску");
    if (modalType === "inspect" && running) {
      if ($("nextRail")) $("nextRail").disabled = inspectId >= state.spawned;
      if ($("inspectAlarm")) $("inspectAlarm").disabled = state.spawned < 2;
      if ($("inspectLive"))
        $("inspectLive").textContent = state.paused ? "Линия на паузе" : "● Линия движется";
    }
  }
  function pause() {
    if (!state?.running) return;
    if (state.paused) {
      state.paused = false;
      log("Движение возобновлено.");
    } else {
      if (state.pauses >= 3) return;
      state.paused = true;
      state.pauses++;
      log("Пауза " + state.pauses + " из 3. Сравните рельсы в истории.");
    }
    updateUI();
  }
  function renderHistory() {
    if (!state) return;
    const el = $("history"),
      atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 40;
    el.innerHTML = state.rails
      .slice(-60)
      .map((r) => cardHTML(r, false))
      .join("");
    el.querySelectorAll("[data-rail]").forEach((b) => (b.onclick = () => inspect(+b.dataset.rail)));
    el.querySelectorAll("canvas").forEach((c) => drawThumb(c, state.schedule.get(+c.dataset.id)));
    $("historyLabel").textContent = state.rails.length ? " · " + state.rails.length : "";
    if (atEnd) el.scrollLeft = el.scrollWidth;

      );
      beep();
      renderHistory();
      updateUI();
      return;
    }
    if (reason === "other") {
      const group = state.otherGroups.find(
        (g) => !g.resolved && ids.every((id) => g.members.includes(id)) && ids.length >= 2,
      );
      if (group) {
        group.resolved = true;
        state.otherSuccess++;
        state.score += 30;
        ids.forEach((id) => (state.schedule.get(id).checked = true));
        log("Другая причина: похожие несерийные следы. +30 очков.", "good");
        forceClose();
        toast("Верно: похожие следы не образуют последовательную серию. +30.");
        beep();
        renderHistory();
        updateUI();
        return;
      }
    }
    state.falseAlarms++;
    state.score -= 50;
    log("Ложная тревога по рельсам " + ids.join(", ") + ". −50 очков.", "bad");
    forceClose();
    toast("Ложная тревога: выбранные рельсы не подтверждают эту причину. −50 очков.", true);
    beep("bad");
    updateUI();
  }
  function confirmEnd() {
    if (!state?.running) return;
    openModal('end', '', 'Завершение смены',
      '<div class="end-actions"><button class="btn" id="cancelEnd">Вернуться к линии</button><button class="btn primary" id="confirmEnd">Завершить смену</button></div>', false, false);
    $('cancelEnd').onclick = forceClose;
    $('confirmEnd').onclick = () => finish(true);
  }
  function finish(early) {
    if (!state?.running) return;
    state.running = false;
    state.paused = false;
    const started = state.episodes.filter((e) => e.first <= state.spawned);
    for (const ep of started)
      if (!ep.resolved && !ep.missed) {
        ep.missed = true;
        state.misses++;
        state.score -= 150;
        state.losses += 12;
        log(
          "Пропуск серии с №" + ep.first + ". −150. Потеря: ещё 12 рельсов прошли без контроля.",
          "bad",
        );
      }
    log(early ? "Смена завершена оператором." : "Все рельсы уровня прошли пост контроля.");
    state.early = early;
    updateUI();
    showResults();
  }
  function showResults() {
    const s = state;
    if (!s) return;
    const avg = s.reactions.length
      ? (s.reactions.reduce((a, b) => a + b, 0) / s.reactions.length).toFixed(1).replace('.', ',')
      : '—';
    openModal('result', '', 'Отчёт по смене', `
      <div class="compact-score"><div class="compact-score-label">Итоговый счёт</div><div class="result-score" id="finalScore">${fmt(s.score)}</div></div>
      <div class="compact-result-stats">
        <div class="compact-result-stat"><b id="successfulStat">${s.success}</b><span>Успешных тревог</span></div>
        <div class="compact-result-stat"><b id="missedStat">${s.misses}</b><span>Пропущенных серий</span></div>
        <div class="compact-result-stat"><b id="falseStat">${s.falseAlarms}</b><span>Ложных тревог</span></div>
        <div class="compact-result-stat"><b id="reactionStat">${avg}</b><span>Рельса до тревоги</span></div>
      </div>
      <div class="compact-result-actions"><button class="btn" id="retryBtn">Повторить</button><button class="btn primary" id="menuBtn">Выбрать уровень</button></div>`, false, false);
    $('retryBtn').onclick = () => startLevel(s.level);
    $('menuBtn').onclick = welcome;
  }
  $("inspectBtn").onclick = () => inspect(selectedId);
  $("alarmBtn").onclick = showAlarm;
  $("pauseBtn").onclick = pause;
  $("resumeBtn").onclick = pause;
  $("endBtn").onclick = confirmEnd;
  $("helpBtn").onclick = () => showHelp();
  $("journalBtn").onclick = showJournal;
  $("closeModal").onclick = () => {
    if (modalType === "help" && helpReturn === "welcome") welcome();
    else closeModal();
  };
  $("modal").onclick = (e) => {
    if (e.target === $("modal") && !["welcome", "result"].includes(modalType)) {
      if (modalType === "help" && helpReturn === "welcome") welcome();
      else closeModal();
    }
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && modalType) {
      const f = $("dialog").querySelectorAll(
          'button:not(:disabled),input:not(:disabled),[tabindex="0"]',
        ),
        arr = [...f].filter((el) => el.getClientRects().length);
      if (!arr.length) return;
      const first = arr[0],
        last = arr.at(-1);
      if (!arr.includes(document.activeElement)) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      } else if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
      return;
    }
    if (e.key === "Escape") {
      if (modalType === "help" && helpReturn === "welcome") welcome();
      else closeModal();
      return;
    }
    if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (!state?.running) return;
    if (e.code === "Space" && !modalType) {
      e.preventDefault();
      pause();
    }
    if (!modalType && (e.code === "KeyI" || e.code === "KeyA")) {
      e.preventDefault();
      if (e.code === "KeyI") inspect(selectedId);
      else showAlarm();
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) return;
    if (state?.running && !state.paused && state.pauses < 3) {
      pause();
      log("Автопауза: вкладка скрыта.");
    } else if (state?.running && !state.paused) {
      log("Вкладка скрыта. Свободных пауз нет — продолжите контроль при возвращении.");
    }
    lastFrame = performance.now();
  });
  window.addEventListener("resize", () => {
    if (modalType === "inspect") drawInspect();
  });
  setupButtons();resize();requestAnimationFrame(tick);welcome();
})();

</script>
  </body>
</html>
